{% extends "base.html" %}

{% block title %}Add to Warehouse{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="back-link">&larr; Back to Warehouses</a>

<h1>Add to Warehouse: {{ warehouse.name }}</h1>

<p>Current Balance: {{ warehouse.varasto.saldo|round(2) }}</p>
<p>Space Available: {{ warehouse.varasto.paljonko_mahtuu()|round(2) }}</p>

<form method="POST">
    <div class="form-group">
        <label for="amount">Amount to Add:</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0" required>
    </div>
    
    <button type="submit" class="btn btn-primary">Add to Warehouse</button>
</form>
{% endblock %}
